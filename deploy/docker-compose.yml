services:
  dbx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        # `.git` is excluded from the build context, so pass the revision in.
        DBX_BUILD_COMMIT: ${DBX_BUILD_COMMIT:-unknown}
    ports:
      - "127.0.0.1:4225:4225"
    environment:
      - DBX_PASSWORD=P@$w0RDDBX
      # Uncomment when publishing DBX under a reverse-proxy subpath, e.g. https://example.com/dbx/
      # - DBX_PUBLIC_BASE_PATH=/dbx
    volumes:
      - dbx-data:/app/data
    restart: unless-stopped

volumes:
  dbx-data:
